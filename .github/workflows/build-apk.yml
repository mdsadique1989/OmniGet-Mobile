name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OmniGet-Mobile-arm64-v1.0.${{ github.run_number }}.apk

      - name: Upload Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: OmniGet-Mobile-APK
          path: OmniGet-Mobile-arm64-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OmniGet Mobile (arm64) v1.0.${{ github.run_number }}"
          body: |
            Automated 64-bit ARM (`arm64-v8a`) build from commit ${{ github.sha }}.
            Includes bundled `yt-dlp`, `FFmpeg`, and `aria2c`.
          files: OmniGet-Mobile-arm64-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
